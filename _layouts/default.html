<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Etude & Code" }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    
    <!-- GSAP & Lenis Animation Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="{{ '/' | relative_url }}">Etude & Code</a></div>
        <ul class="nav-links">
            <li><a href="#">BLOG</a></li>
            <li><a href="#">SETUPS</a></li>
            <li><a href="#">PROJECTS</a></li>
            <li><a href="#">STATIONERY</a></li>
            <li><a href="#">ABOUT</a></li>
        </ul>
    </nav>

    <main class="page-content">
        {{ content }}
    </main>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0);

        // Staggered Blog Card Animation
        gsap.to(".reveal-card", {
            scrollTrigger: { trigger: ".cards-grid", start: "top 85%" },
            y: 0, opacity: 1, duration: 0.8, ease: "power2.out", stagger: 0.2 
        });
    </script>
</body>
</html>
