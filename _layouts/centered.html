---
layout: default
---
<article class="centered-layout">
    <header class="article-header">
        <span class="category">{{ page.category }}</span>
        <h1>{{ page.title }}</h1>
        <img src="{{ page.image }}" alt="Project Cover" class="cover-image">
    </header>
    <div class="article-content">
        {{ content }}
    </div>
</article>
