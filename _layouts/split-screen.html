---
layout: default
---
<section class="split-screen">
    <!-- Dynamically pulls the hardware image you set in your blog post -->
    <div class="left-fixed" style="background-image: url('{{ page.image }}');"></div>
    
    <div class="right-scroll">
        <div class="article-content">
            <span class="category">{{ page.category }}</span>
            <h1>{{ page.title }}</h1>
            
            {{ content }}
            
            <!-- Button linking to your open-source code or Amazon affiliate -->
            <a href="{{ page.github_link }}" class="btn-primary" target="_blank">View Project Links</a>
        </div>
    </div>
</section>
