---
layout: default
---
<div class="main-feed">
    <h2 class="section-title">LATEST PROJECT SETUPS</h2>
    
    <div class="cards-grid">
        <!-- This loop automatically fetches your markdown blog posts -->
        {% for post in site.posts %}
        <a href="{{ post.url | relative_url }}" class="post-card">
            <img src="{{ post.image }}" alt="{{ post.title }}">
            <h4>{{ post.title }}</h4>
            <p>{{ post.excerpt | strip_html | truncatewords: 20 }}</p>
        </a>
        {% endfor %}
    </div>
</div>
