<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etude & Code | Journal & Products</title>
    <link rel="stylesheet" href="style.css">
    <meta name="p:domain_verify" content="c90ae61ed3c6632a0505bb44db0538a6"/>
    
    <!-- Free Animation Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
</head>
<body>

    <header class="page-header">
        <h1>Journal & Setups</h1>
        <p>Explore minimalist desk aesthetics and coding resources.</p>
    </header>

    <main class="grid-container">
        <!-- Blog/Product Card 1 -->
        <article class="reveal-card">
            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1517842645767-c639042777db?q=80&w=800&auto=format&fit=crop');"></div>
            <div class="card-content">
                <span class="category">Desk Setup</span>
                <h2>The Ultimate Guide to Digital Note-Taking</h2>
                <a href="article.html" class="read-more">Read Article</a>               
            </div>
        </article>

        <!-- Blog/Product Card 2 -->
        <article class="reveal-card">
            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1593640408182-31c70c8268f5?q=80&w=800&auto=format&fit=crop');"></div>
            <div class="card-content">
                <span class="category">Tech Review</span>
                <h2>Minimalist Mechanical Keyboard Build</h2>
                <a href="#" class="read-more">Shop Components</a>
            </div>
        </article>

        <!-- Blog/Product Card 3 -->
        <article class="reveal-card">
            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop');"></div>
            <div class="card-content">
                <span class="category">Electronics</span>
                <h2>Getting Started with Arduino Projects</h2>
                <a href="#" class="read-more">Read Article</a>
            </div>
        </article>
    </main>

    <script>
        // Initialize Smooth Scrolling
        const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000) });
        gsap.ticker.lagSmoothing(0);
        gsap.registerPlugin(ScrollTrigger);

        // Staggered Card Reveal Animation
        gsap.from(".reveal-card", {
            scrollTrigger: {
                trigger: ".grid-container",
                start: "top 80%",
            },
            y: 100,
            opacity: 0,
            duration: 0.8,
            ease: "power2.out",
            stagger: 0.2 
        });
    </script>
</body>
</html>
